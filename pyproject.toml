[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arithmetic-secret-sharing"
version = "0.1.0"
description = "Research prototype of RS codes and arithmetic secret sharing over prime fields"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["field", "polynomial", "shamir", "reed_solomon", "linear_algebra", "code_square", "multiplication", "concatenation", "research_report", "experimental_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
